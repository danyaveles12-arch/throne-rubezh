[package]
name = "throne-rubezh"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14"

# Быстрая отладочная сборка: свой код с лёгкой оптимизацией, зависимости с полной.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
